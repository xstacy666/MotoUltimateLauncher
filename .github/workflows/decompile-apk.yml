name: Decompile Launcher APK
on:
  push:
    branches: [automation/decompile-apk-audit]
    paths:
      - '.github/workflows/decompile-apk.yml'
  workflow_dispatch:
    inputs:
      apk_path:
        description: Path to an APK already committed in the repository
        required: true
        default: source/com.motorola.launcher3.apk
        type: string
      decode_resources:
        description: Decode resources as well as DEX to smali
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o apktool
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o apktool.jar
          chmod +x apktool
          sudo install -m 0755 apktool /usr/local/bin/apktool
          sudo install -m 0644 apktool.jar /usr/local/bin/apktool.jar
          apktool --version
      - name: Validate and audit APK
        shell: bash
        env:
          APK_PATH: ${{ github.event.inputs.apk_path || 'source/com.motorola.launcher3.apk' }}
        run: |
          set -euo pipefail
          test -f "$APK_PATH" || { echo "APK not found in repository: $APK_PATH" >&2; exit 1; }
          case "$APK_PATH" in *.apk) ;; *) echo 'Input path must end in .apk' >&2; exit 1;; esac
          mkdir -p audit
          sha256sum "$APK_PATH" | tee audit/sha256.txt
          stat -c 'size_bytes=%s' "$APK_PATH" | tee audit/size.txt
          unzip -tq "$APK_PATH"
          unzip -l "$APK_PATH" | grep -E 'classes([0-9]+)?\\.dex|resources\\.arsc' > audit/apk_entries.txt || true
      - name: Decode APK with resources
        if: ${{ github.event_name == 'push' || inputs.decode_resources }}
        shell: bash
        env:
          APK_PATH: ${{ github.event.inputs.apk_path || 'source/com.motorola.launcher3.apk' }}
        run: apktool d --force "$APK_PATH" -o decoded-launcher
      - name: Decode APK without resources
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.decode_resources }}
        shell: bash
        env:
          APK_PATH: ${{ github.event.inputs.apk_path || 'source/com.motorola.launcher3.apk' }}
        run: apktool d --force --no-res "$APK_PATH" -o decoded-launcher
      - name: Save decompile notes
        shell: bash
        env:
          APK_PATH: ${{ github.event.inputs.apk_path || 'source/com.motorola.launcher3.apk' }}
        run: |
          {
            echo '# Launcher APK decompile run'
            echo
            echo "- Input: $APK_PATH"
            echo "- Commit: $GITHUB_SHA"
            echo "- Apktool: $(apktool --version)"
            echo '- SHA-256:'
            cat audit/sha256.txt
            echo
            echo 'Apktool output contains decoded resources and smali, not reconstructed original Java/Kotlin source.'
          } > decoded-launcher/DECOMPILE-INFO.md
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-decompiled-${{ github.run_number }}
          path: |
            decoded-launcher/
            audit/
          if-no-files-found: error
          retention-days: 14
