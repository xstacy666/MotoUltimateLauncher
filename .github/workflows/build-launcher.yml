name: Build Moto Launcher APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - '.github/workflows/build-launcher.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android build tools
        run: |
          set -euo pipefail
          sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
      - name: Install Apktool
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o apktool
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o apktool.jar
          chmod +x apktool
          sudo mv apktool /usr/local/bin/apktool
          sudo mv apktool.jar /usr/local/bin/apktool.jar
      - name: Prepare source
        run: |
          set -euo pipefail
          ORIGINAL=source/MotoLauncher3_Ultimate.apk
          if [ ! -f "$ORIGINAL" ]; then
            echo "::error::Upload the original APK as source/MotoLauncher3_Ultimate.apk. A fully decoded ZIP cannot preserve the original OEM resource table."
            exit 1
          fi
          mkdir -p work
          unzip -q source/MotoLauncher3_Ultimate_Patched_All.zip -d work/source-archive
          PATCHED="$(find work/source-archive -type f -path '*/smali/com/android/launcher3/ModStack.smali' -print -quit)"
          test -n "$PATCHED"
          apktool d -f -r "$ORIGINAL" -o work/decoded
          mkdir -p work/decoded/smali/com/android/launcher3
          cp "$PATCHED" work/decoded/smali/com/android/launcher3/ModStack.smali
          echo "DECODED=work/decoded" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          set -euo pipefail
          apktool b "$DECODED" -o MotoLauncher3-Ultimate-unsigned.apk
          test -s MotoLauncher3-Ultimate-unsigned.apk
      - name: Sign APK
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore ci-test.jks -alias launcher-ci -keyalg RSA -keysize 2048 -validity 10000 -storepass ci-test-password -keypass ci-test-password -dname "CN=Moto Launcher CI Test"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks ci-test.jks --ks-key-alias launcher-ci --ks-pass pass:ci-test-password --key-pass pass:ci-test-password --out MotoLauncher3-Ultimate-CI-signed.apk MotoLauncher3-Ultimate-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose MotoLauncher3-Ultimate-CI-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MotoLauncher3-Ultimate-CI-build
          path: |
            MotoLauncher3-Ultimate-CI-signed.apk
            MotoLauncher3-Ultimate-unsigned.apk
          if-no-files-found: error
          retention-days: 14
# Trigger a fresh build after the stock APK upload.
