name: Build Moto Launcher APK (full patched source)
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - 'tools/**'
      - '.github/workflows/build-launcher.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools and Apktool
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
          curl -fsSL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o apktool
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
          chmod +x apktool
          sudo mv apktool /usr/local/bin/apktool
          sudo mv apktool.jar /usr/local/bin/apktool.jar
          apktool --version
      - name: Validate patched source and decode original without OEM resource relinking
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=source/MotoLauncher3_Ultimate_Patched_All.zip
          ORIGINAL=source/MotoLauncher3_Ultimate.apk
          test -s "$ARCHIVE"
          test -s "$ORIGINAL"
          unzip -tq "$ARCHIVE"
          mkdir -p work
          unzip -q "$ARCHIVE" -d work/source
          PATCHED_ROOT="$(find work/source -type f -name apktool.yml -print -quit | xargs -r dirname)"
          if [ -z "$PATCHED_ROOT" ]; then
            echo "::error::Patched source archive has no apktool.yml."
            exit 1
          fi
          test -f "$PATCHED_ROOT/smali/com/android/launcher3/ModStack.smali" -o -f "$PATCHED_ROOT/smali_classes2/com/android/launcher3/ModStack.smali"
          apktool d -f -r "$ORIGINAL" -o work/decoded
          cp -a work/decoded/smali work/baseline-smali
          python3 tools/apply_icon_lab_zoom_controls.py "$PATCHED_ROOT"
          python3 tools/apply_recents_dock_fixes.py "$PATCHED_ROOT"
          bash tools/prepare_resource_build.sh "$PATCHED_ROOT"
          echo "PATCHED_ROOT=$PATCHED_ROOT" >> "$GITHUB_ENV"
          echo "DECODED=work/decoded" >> "$GITHUB_ENV"
          find "$PATCHED_ROOT" -maxdepth 1 -type d -name 'smali*' -print | sort > work/smali-roots.txt
          test -s work/smali-roots.txt
          cat work/smali-roots.txt
      - name: Overlay all patched Smali source trees
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r SRC; do
            NAME="$(basename "$SRC")"
            mkdir -p "$DECODED/$NAME"
            cp -a "$SRC/." "$DECODED/$NAME/"
          done < work/smali-roots.txt
          if diff -qr work/baseline-smali "$DECODED/smali" > work/smali-diff.txt; then
            echo "::error::No changes detected in the primary Smali tree after applying the patched source."
            exit 1
          fi
          echo "Primary Smali changes:"
          sed -n '1,80p' work/smali-diff.txt
          find "$DECODED" -type f -name '*.smali' | wc -l | tee work/smali-count.txt
      - name: Build complete patched source and settings resources
        shell: bash
        run: |
          set -euo pipefail
          apktool b "$PATCHED_ROOT" -o MotoLauncher3-Ultimate-unsigned.apk
          test -s MotoLauncher3-Ultimate-unsigned.apk
          mkdir -p work/output
          unzip -Z1 MotoLauncher3-Ultimate-unsigned.apk | grep -E '^classes([0-9]+)?\.dex$' | sort > work/output/dex-list.txt
          test -s work/output/dex-list.txt
          cat work/output/dex-list.txt
          sha256sum MotoLauncher3-Ultimate-unsigned.apk | tee work/output/apk-sha256.txt
          {
            echo "Build mode: complete patched Apktool project, including resources and settings XML"
            echo "Smali source file count: $(cat work/smali-count.txt)"
            echo "Changed primary Smali entries:"
            sed -n '1,80p' work/smali-diff.txt
            echo "DEX files in output:"
            cat work/output/dex-list.txt
            echo "Unsigned APK SHA-256:"
            cat work/output/apk-sha256.txt
          } > MotoLauncher3-build-report.txt
      - name: Verify custom settings resources
        run: bash tools/verify_feature_resources.sh MotoLauncher3-Ultimate-unsigned.apk
      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore ci-test.jks -alias launcher-ci -keyalg RSA -keysize 2048 -validity 10000 -storepass ci-test-password -keypass ci-test-password -dname "CN=Moto Launcher CI Test"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks ci-test.jks --ks-key-alias launcher-ci --ks-pass pass:ci-test-password --key-pass pass:ci-test-password --out MotoLauncher3-Ultimate-CI-signed.apk MotoLauncher3-Ultimate-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose MotoLauncher3-Ultimate-CI-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging MotoLauncher3-Ultimate-CI-signed.apk | tee work/output/manifest-badging.txt
          grep -q "package: name='com.motorola.launcher3'" work/output/manifest-badging.txt
          cat work/output/manifest-badging.txt >> MotoLauncher3-build-report.txt
          sha256sum MotoLauncher3-Ultimate-CI-signed.apk >> MotoLauncher3-build-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MotoLauncher3-Ultimate-Patched-CI-build
          path: |
            MotoLauncher3-Ultimate-CI-signed.apk
            MotoLauncher3-Ultimate-unsigned.apk
            MotoLauncher3-build-report.txt
          if-no-files-found: error
          retention-days: 14
