name: Reverse-engineer launcher APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/analyze_launcher_apk.sh'
      - 'docs/reverse-engineering.md'
      - '.github/workflows/analyze-launcher-apk.yml'
      - 'source/MotoLauncher3_Ultimate_Patched_All.zip'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Apktool and JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o /tmp/apktool.jar
          sudo install -m 0644 /tmp/apktool.jar /usr/local/bin/apktool.jar
          printf '#!/usr/bin/env bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          curl -fsSL https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx
          apktool --version
          jadx --version
      - name: Decode source project and build analysis APK
        shell: bash
        run: |
          set -euo pipefail
          test -f source/MotoLauncher3_Ultimate_Patched_All.zip
          unzip -tq source/MotoLauncher3_Ultimate_Patched_All.zip
          mkdir -p work
          unzip -q source/MotoLauncher3_Ultimate_Patched_All.zip -d work
          DECODED="$(find work -type f -name apktool.yml -print -quit | xargs -r dirname)"
          test -n "$DECODED"
          apktool b --no-res "$DECODED" -o MotoLauncher3-Ultimate-analysis.apk
          test -s MotoLauncher3-Ultimate-analysis.apk
      - name: Run static reverse-engineering analysis
        shell: bash
        run: |
          set -euo pipefail
          bash tools/analyze_launcher_apk.sh MotoLauncher3-Ultimate-analysis.apk ./analysis/launcher
          cat ./analysis/launcher/REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: MotoUltimateLauncher-ReverseEngineering-Report
          path: |
            analysis/launcher/REPORT.md
            analysis/launcher/zip-integrity.txt
            analysis/launcher/jadx.log
            analysis/launcher/java/
            analysis/launcher/resources/
          if-no-files-found: error
          retention-days: 14
